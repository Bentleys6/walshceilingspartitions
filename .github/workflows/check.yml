# Runs on every push and pull request. A red ✗ on GitHub means don't merge to main.
name: Check site

on:
  push:
  pull_request:
  schedule:
    # Weekly security scan, so new vulnerabilities show up even when nobody is changing the site.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install packages
        run: bun install --frozen-lockfile
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Tests and security scan
        run: npm test
      - name: Security scan (packages that reach visitors)
        run: bun audit --prod
      - name: Security scan (build tools, report only)
        run: bun audit || true
